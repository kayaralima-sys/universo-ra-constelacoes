
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Universo RA — Laboratório das Constelações</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #173b76, #050b20 75%);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header { padding: 65px 20px 25px; }
    h1 { color: #ffda75; font-size: 2.5rem; }
    p { line-height: 1.6; }
    .grade {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      max-width: 950px;
      margin: 35px auto;
      padding: 20px;
    }
    .constelacao {
      padding: 25px 12px;
      background: #132c59;
      border: 1px solid #5475b5;
      border-radius: 15px;
      font-size: 1.15rem;
    }
    footer { padding: 25px; color: #b5c8ed; }
  </style>
</head>
<body>
  <header>
    <h1>🌌 UNIVERSO RA</h1>
    <h2>Laboratório Virtual das Constelações</h2>
    <p>Explore as 12 constelações do zodíaco em uma jornada pelo Universo!</p>
  </header>

  <main class="grade">
    <div class="constelacao">♈ Áries</div>
    <div class="constelacao">♉ Touro</div>
    <div class="constelacao">♊ Gêmeos</div>
    <div class="constelacao">♋ Câncer</div>
    <div class="constelacao">♌ Leão</div>
    <div class="constelacao">♍ Virgem</div>
    <div class="constelacao">♎ Libra</div>
    <div class="constelacao">♏ Escorpião</div>
    <div class="constelacao">♐ Sagitário</div>
    <div class="constelacao">♑ Capricórnio</div>
    <div class="constelacao">♒ Aquário</div>
    <div class="constelacao">♓ Peixes</div>
  </main>

  <footer>
    Universo RA — Astronomia, Educação e Tecnologia
  </footer>
</body>
</html>
